[package]
name = "dust-ids"
version = "1.0.0"
authors = ["Jose Palanco <jose.palanco@puffinsecurity.com>", "Ricardo Stefanescu <ricardo.stefanescu@puffinsecurity.com>"]
edition = "2021"
repository = "https://github.com/puffinsecurity/DustIDS"
readme = "README.md"
keywords = ["cli", "starter"]
description = """
The lean IDS
"""

[workspace]
members = ["utils", "cli", "core"]

[features]
nightly = ["utils/nightly"]
termlog = ["utils/termlog"]
journald = ["utils/journald"]
syslog = ["utils/syslog"]

[dependencies]
utils = { path = "utils" }
cli = { path = "cli" }
core = { path = "core" }
human-panic = "1.2.2"
better-panic = "0.3.0"
log = "0.4.20"
xdpsock = "0.1.0"
byteorder = "1.5.0"
etherparse = "0.14.3"
pnet = "0.34.0"
yara-x = "0.3.0"
yara-x-parser = "0.3.0"
slog-json = "2.6.1"
serde_json = "1.0.117"
tokio = "1.37.0"
serde = "1.0.203"
chrono = "0.4.38"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.13"
afxdp = "0.4.0"
libbpf-sys = "=0.3.0-2"
libc = "0.2.155"
rebpf = "0.1.5"
core_affinity = "0.5"
arraydeque = "0.4"
num_cpus = "1.16.0"
hex = "0.4.3"
atomic-counter = "1.0.1"

[dev-dependencies]
assert_cmd = "2.0.12"
predicates = "3.0.4"

[profile.dev]
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
